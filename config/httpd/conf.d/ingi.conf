Listen 8000
ServerName localhost

# Runs as the uid owning ./data, so the web task editor writes usable files
User www-data
Group www-data

Alias /favicon.ico /inginious/inginious/frontend/static/icons/favicon.ico
Alias /static /inginious/inginious/frontend/static
Alias /plugins/ntnu_problem_types /inginious/inginious/frontend/plugins/ntnu_problem_types/ntnu_problem_types
Alias /plugins/ntnu_inginious /inginious/inginious/frontend/plugins/ntnu_inginious/ntnu_inginious
Alias /plugins/inginious_katex /inginious/inginious/frontend/plugins/inginious_katex/inginious_katex

WSGIPythonHome /ingivenv

<VirtualHost *:8000>
	DocumentRoot /inginious

	LogLevel info
	ErrorLog /inginious/logs/inginious_error_log
	TransferLog /inginious/logs/inginious_access_log

	WSGIScriptAlias / /inginious/webapp-wrapper
	WSGIScriptReloading On
	WSGIApplicationGroup %{GLOBAL}

	<Directory /inginious>
		Require all granted
	</Directory>

	<Directory /inginious/inginious/frontend/static/>
		Require all granted
	</Directory>
</VirtualHost>
